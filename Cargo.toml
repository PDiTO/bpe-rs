[package]
name = "bpe-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Byte-level BPE tokenizer compatible with tiktoken rank files, with training and Python bindings"
license = "MIT"
readme = "README.md"
authors = ["Paul Davis"]
keywords = ["tokenizer", "bpe", "tiktoken", "nlp"]
categories = ["text-processing", "encoding"]

[lib]
name = "bpe_rs"

[dependencies]
aho-corasick = "=1.1.4"
base64 = "=0.22.1"
fancy-regex = "=0.18.0"
rayon = "=1.12.0"
rustc-hash = "=2.1.2"
thiserror = "=2.0.18"

[dev-dependencies]
proptest = "=1.11.0"

# Dependencies (fancy-regex in particular) are painfully slow unoptimized, which makes
# the property tests drag. Optimizing them keeps `cargo test` quick while the crate
# itself still builds with debug assertions.
[profile.dev.package."*"]
opt-level = 2
